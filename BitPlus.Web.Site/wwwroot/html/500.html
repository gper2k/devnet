<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>500 - Something went wrong</title>
    <link rel="stylesheet" href="/lib/fluenticons/fluenticons.min.css" />
    <link rel="stylesheet" href="/html/error.css" />
</head>
<body class="danger">
    <main>
        <p class="label">ERROR 500 · SERVER ERROR</p>
        <h1 class="code" aria-label="500"><span>5</span><i class="fi fiBug fiFill"></i><span>0</span></h1>
        <h2>Something went wrong</h2>
        <p class="desc">The server ran into a problem and could not finish your request. Try again shortly, and tell your administrator if it keeps happening.</p>
        <nav>
            <button type="button" data-act="reload">Try again</button>
            <a href="/" data-act="home">Home</a>
        </nav>
    </main>
    <script src="/html/error.js"></script>
</body>
</html>
