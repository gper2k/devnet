<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>503 - Service unavailable</title>
    <link rel="stylesheet" href="/lib/fluenticons/fluenticons.min.css" />
    <link rel="stylesheet" href="/html/error.css" />
</head>
<body class="warning">
    <main>
        <p class="label">ERROR 503 · SERVICE UNAVAILABLE</p>
        <h1 class="code" aria-label="503"><span>5</span><i class="fi fiPlugDisconnected fiFill"></i><span>3</span></h1>
        <h2>Service unavailable</h2>
        <p class="desc">The service is down for maintenance or overloaded right now. Please try again in a moment.</p>
        <nav>
            <button type="button" data-act="reload">Try again</button>
            <a href="/" data-act="home">Home</a>
        </nav>
    </main>
    <script src="/html/error.js"></script>
</body>
</html>
