<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>408 - Request timeout</title>
    <link rel="stylesheet" href="/lib/fluenticons/fluenticons.min.css" />
    <link rel="stylesheet" href="/html/error.css" />
</head>
<body class="warning">
    <main>
        <p class="label">ERROR 408 · REQUEST TIMEOUT</p>
        <h1 class="code" aria-label="408"><span>4</span><i class="fi fiClock fiFill"></i><span>8</span></h1>
        <h2>Request timeout</h2>
        <p class="desc">The server timed out waiting for the request. Please try again in a moment.</p>
        <nav>
            <button type="button" data-act="reload">Try again</button>
            <a href="/" data-act="home">Home</a>
        </nav>
    </main>
    <script src="/html/error.js"></script>
</body>
</html>
