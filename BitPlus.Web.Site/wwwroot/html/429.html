<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>429 - Too many requests</title>
    <link rel="stylesheet" href="/lib/fluenticons/fluenticons.min.css" />
    <link rel="stylesheet" href="/html/error.css" />
</head>
<body class="warning">
    <main>
        <p class="label">ERROR 429 · TOO MANY REQUESTS</p>
        <h1 class="code" aria-label="429"><span>4</span><i class="fi fiTimer fiFill"></i><span>9</span></h1>
        <h2>Too many requests</h2>
        <p class="desc">There were too many requests in a short time. Please wait a moment and try again.</p>
        <nav>
            <button type="button" data-act="reload">Try again</button>
            <a href="/" data-act="home">Home</a>
        </nav>
    </main>
    <script src="/html/error.js"></script>
</body>
</html>
